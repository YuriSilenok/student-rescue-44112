limit_req_zone $binary_remote_addr zone=student_rescue_api:10m rate=10r/s;
server {
    listen 44112 ssl;
    listen [::]:44112 ssl;
    server_name xn--e1afhclgq.xn--p1ai;
    error_page 497 =308 https://xn--e1afhclgq.xn--p1ai:44112$request_uri;
    ssl_certificate /etc/letsencrypt/live/xn--e1afhclgq.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--e1afhclgq.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/student-rescue/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location /api/ {
        limit_req zone=student_rescue_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:44113;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;
        add_header Cache-Control "no-store";
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
